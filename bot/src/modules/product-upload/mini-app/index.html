<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Product Upload</title>
    <link rel="stylesheet" href="./styles.v5.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./app.v5.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Add New Product</h1>
        <p>Create a separate product for every color and its photos.</p>
      </header>

      <div id="authNotice" class="message message--error" hidden>
        Authentication is missing. Run <strong>/addproduct</strong> in the Telegram bot and open the new Mini App button.
      </div>

      <form id="productForm" novalidate>
        <section class="panel common-panel">
          <h2>Product Information</h2>

          <div class="form-grid form-grid--three">
            <label class="field">
              <span>Type</span>
              <select name="type" id="type" required>
                <option value="">Select Type</option>
                <option value="shoe">Shoe</option>
                <option value="belt">Belt</option>
                <option value="bag">Bag</option>
                <option value="luggage">Luggage</option>
                <option value="glasses">Glasses</option>
                <option value="watch">Watch</option>
              </select>
            </label>

            <label class="field">
              <span>Brand</span>
              <select name="brandName" id="brandName" required disabled>
                <option value="">Loading brands...</option>
              </select>
              <small id="brandHint"></small>
            </label>

            <label class="field">
              <span>Gender</span>
              <select name="gender" id="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="genderless">Genderless</option>
              </select>
            </label>

            <label class="field" id="categoryField" hidden>
              <span>Category</span>
              <select name="category" id="category" disabled>
                <option value="">Select Category</option>
                <option value="sneaker">Sneaker</option>
                <option value="loafer">Loafer</option>
                <option value="formal">Formal</option>
                <option value="boot">Boot</option>
                <option value="sandal">Sandal</option>
                <option value="sport">Sport</option>
                <option value="classic">Classic</option>
                <option value="heels">Heels</option>
                <option value="flat">Flat</option>
                <option value="other">Other</option>
              </select>
            </label>

            <label class="field field--wide">
              <span>Model</span>
              <input name="model" id="model" maxlength="255" placeholder="e.g. Air Max 97" required />
            </label>

            <label class="field">
              <span>Price</span>
              <input name="price" id="price" type="number" min="0" inputmode="decimal" required />
            </label>

            <label class="field">
              <span>Discount Price</span>
              <input name="discountPrice" id="discountPrice" type="number" min="0" inputmode="decimal" placeholder="Optional" />
            </label>

            <label class="field field--full">
              <span>Description (optional)</span>
              <textarea name="description" id="description" maxlength="2000" rows="4" placeholder="Short description of the product..."></textarea>
            </label>
          </div>
        </section>

        <label class="panel sale-option">
          <input type="checkbox" name="addToSale" id="addToSale" />
          <span>
            <strong>Add to Sale</strong>
            <small>Anilox only — adds men&apos;s or genderless shoes to the Sale catalog after creation.</small>
          </span>
        </label>

        <section class="variants-section">
          <div class="variants-heading">
            <div>
              <h2>Colors &amp; Photos</h2>
              <p>Each row creates one separate product.</p>
            </div>
            <div class="variant-actions">
              <button type="button" class="small-button" data-add-count="3">+3</button>
              <button type="button" class="small-button" data-add-count="5">+5</button>
              <button type="button" class="small-button" data-add-count="10">+10</button>
              <button type="button" id="addVariantButton" class="small-button small-button--primary">+ Add Color</button>
            </div>
          </div>

          <div id="variants" class="variant-list"></div>
        </section>

        <fieldset class="panel destinations">
          <legend>Publish To</legend>
          <label><input type="checkbox" name="destinations" value="anilox" checked /> Anilox</label>
          <label><input type="checkbox" name="destinations" value="ebraha" checked /> EbrahaStyle</label>
          <label><input type="checkbox" name="destinations" value="telegram" checked /> Telegram</label>
          <label><input type="checkbox" name="destinations" value="instagram" checked /> Instagram</label>
        </fieldset>

        <div id="result" class="message" aria-live="polite" hidden></div>

        <button id="submitButton" type="submit" class="submit-button">
          Create All Products
        </button>
      </form>
    </main>
  </body>
</html>
